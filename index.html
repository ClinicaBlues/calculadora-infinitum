<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Calculadora de Planos · Clínica Infinitum</title>
<style>
:root{--bg:#FBFAF7;--ink:#1D2524;--mut:#5F6765;--gold:#B8862B;--teal:#1B5E61;--line:#D9D1C4}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Jost","Avenir Next","Segoe UI",Roboto,Arial,sans-serif;padding:16px}
.box{width:100%;max-width:380px;background:#fff;border:1px solid var(--line);padding:36px 28px;box-shadow:0 30px 60px -40px rgba(40,30,15,.35)}
.k{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin:0 0 10px}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:32px;line-height:1.05;margin:0 0 22px}
label{font-size:14px;font-weight:500;display:block;margin-bottom:8px}
input{width:100%;font:inherit;font-size:16.5px;padding:14px;border:1px solid var(--line);border-radius:2px}
input:focus{outline:none;border-color:var(--teal)}
button{margin-top:16px;width:100%;font:inherit;font-weight:500;font-size:16px;padding:15px;border:0;border-radius:2px;background:var(--teal);color:#fff;cursor:pointer}
button:disabled{opacity:.6}
.err{color:#9E3A22;font-size:14px;min-height:20px;margin-top:10px}
.n{font-size:12.5px;color:var(--mut);margin-top:14px;line-height:1.5}
</style>
</head>
<body>
<form class="box" id="f">
  <p class="k">Clínica Infinitum</p>
  <h1>Calculadora de planos</h1>
  <label for="p">Senha de acesso</label>
  <input id="p" type="password" autocomplete="current-password" autofocus>
  <button id="b">Entrar</button>
  <div class="err" id="e"></div>
  <p class="n">Uso interno das médicas da clínica.</p>
</form>
