<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Calculadora de Planos · Clínica Infinitum</title>
<style>
:root{--bg:#FBFAF7;--ink:#1D2524;--mut:#5F6765;--gold:#B8862B;--teal:#1B5E61;--line:#D9D1C4}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Jost","Avenir Next","Segoe UI",Roboto,Arial,sans-serif;padding:16px}
.box{width:100%;max-width:380px;background:#fff;border:1px solid var(--line);padding:36px 28px;box-shadow:0 30px 60px -40px rgba(40,30,15,.35)}
.k{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin:0 0 10px}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:32px;line-height:1.05;margin:0 0 22px}
label{font-size:14px;font-weight:500;display:block;margin-bottom:8px}
input{width:100%;font:inherit;font-size:16.5px;padding:14px;border:1px solid var(--line);border-radius:2px}
input:focus{outline:none;border-color:var(--teal)}
.pw{position:relative}
.pw input{padding-right:92px}
.pw button{position:absolute;right:6px;top:6px;bottom:6px;margin:0;width:auto;padding:0 12px;background:#fff;color:var(--teal);border:1px solid var(--line);font-size:14px}
button{margin-top:16px;width:100%;font:inherit;font-weight:500;font-size:16px;padding:15px;border:0;border-radius:2px;background:var(--teal);color:#fff;cursor:pointer}
button:disabled{opacity:.6}
.err{color:#9E3A22;font-size:14px;min-height:20px;margin-top:10px}
.n{font-size:12.5px;color:var(--mut);margin-top:14px;line-height:1.5}
</style>
</head>
<body>
<form class="box" id="f">
  <p class="k">Clínica Infinitum</p>
  <h1>Calculadora de planos</h1>
  <label for="p">Senha de acesso</label>
  <div class="pw"><input id="p" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus><button type="button" id="eye" aria-label="Mostrar senha">Mostrar</button></div>
  <button id="b">Entrar</button>
  <div class="err" id="e"></div>
  <p class="n">Uso interno das médicas da clínica.</p>
</form>

  function u8(b){ var s=atob(b), a=new Uint8Array(s.length); for(var i=0;i<s.length;i++) a[i]=s.charCodeAt(i); return a; }
  function loadForge(){ return new Promise(function(res,rej){ if (window.forge) return res(); var sc=document.createElement('script'); sc.src='https://cdnjs.cloudflare.com/ajax/libs/forge/1.3.1/forge.min.js'; sc.onload=res; sc.onerror=rej; document.head.appendChild(sc); }); }
  async function openForge(pw){
    await loadForge(); var f=window.forge;
    var key = f.pkcs5.pbkdf2(f.util.encodeUtf8(pw), atob(S), IT, 32, f.md.sha256.create());
    var raw = atob(CT), tag = raw.slice(-16), body = raw.slice(0,-16);
    var d = f.cipher.createDecipher('AES-GCM', key); d.start({ iv: atob(IV), tag: f.util.createBuffer(tag) });

  }
  async function open(pw){
    if (!(window.crypto && crypto.subtle)) return openForge(pw);
    var km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:u8(S), iterations:IT, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);

    return new TextDecoder().decode(pt);
  }
  async function go(pw, silent){
    var b=document.getElementById('b'), e=document.getElementById('e');

    try { var html = await open(pw); try { sessionStorage.setItem('calc-pw', pw); } catch(x){} document.open(); document.write(html); document.close(); }
